<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="description" content="Chill Coffee Brewing Game">
    <meta name="theme-color" content="#2c3e50">
    <title>#c0ffee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- PC/Tablet Background (Visible outside container) -->
    <div id="app-background"></div>

    <!-- Main Game Container (Responsive: Mobile size on PC) -->
    <main id="game-container">

        <!-- Orientation Overlay (For Mobile Landscape) -->
        <div id="rotate-overlay">
            <div class="overlay-content">
                <p>Please Rotate Your Device</p>
                <div class="icon-rotate">↻</div>
            </div>
        </div>

        <!-- Loading Screen -->
        <section id="loading-screen" class="screen active">
            <div class="loader-content">
                <div class="spinner"></div>
                <p>Brewing...</p>
            </div>
        </section>

        <!-- Start Screen -->
        <section id="start-screen" class="screen">
            <div class="title-area">
                <h1>#c0ffee</h1>
                <p class="subtitle">Chill & Brew</p>
            </div>
            <button id="start-btn" class="btn-primary">OPEN SHOP</button>
            <p class="hint-text">Sound On Recommended 🎧</p>
        </section>

        <!-- Game Screen -->
        <section id="game-screen" class="screen">
            <!-- Header: Customer Info & Settings -->
            <header class="game-header">
                <div class="customer-info">
                    <span id="customer-name">Guest</span>
                    <span id="customer-counter"></span>
                </div>
                <button id="menu-btn" class="icon-btn">☰</button>
            </header>

            <!-- Main View: Customer & Counter -->
            <div class="main-view">
                <div id="customer-area">
                    <!-- Customer Image Placeholder -->
                    <div class="customer-placeholder"></div>
                    <!-- Dialogue Bubble -->
                    <div id="dialogue-bubble" class="bubble hidden">
                        <p id="dialogue-text">...</p>
                    </div>
                </div>

                <div id="counter-area">
                    <!-- Coffee Equipment Area -->
                    <div id="equipment-area">
                        <!-- Grinder -->
                        <div id="grinder" class="equipment hidden">
                            <div class="grinder-icon">⚙️</div>
                            <div class="bean-visual">🫘</div>
                        </div>
                        <!-- Dripper/Cup -->
                        <div id="dripper" class="equipment hidden">
                            <div class="cup-container">
                                <div class="cup-front-mask"></div>
                                <div class="liquid"></div>
                                <div class="target-line"></div>
                            </div>
                            <div class="steam-container">
                                <div class="steam"></div>
                                <div class="steam"></div>
                                <div class="steam"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Controls Area -->
            <div class="controls-area">
                <div id="action-guide" class="guide-text hidden">Hold to Grind</div>
                <button id="action-btn" class="btn-action">ACTION</button>
            </div>
        </section>

        <!-- Result Screen -->
        <section id="result-screen" class="screen">
            <div class="result-content">
                <h2>Brew Result</h2>
                <div class="stars">★★★</div>
                <p id="result-message">Perfect Brew!</p>

                <!-- Today's Word (Session Result) -->
                <div id="todays-word" class="word-card hidden">
                    <h3>Today's Word</h3>
                    <p id="word-text">一期一会</p>
                </div>

                <button id="next-customer-btn" class="btn-primary">Next Customer</button>
            </div>
        </section>

        <!-- Audio Resume Overlay (iOS) -->
        <div id="audio-resume-overlay" class="overlay hidden">
            <p>Tap to Resume</p>
        </div>

        <!-- Menu Overlay -->
        <div id="menu-overlay" class="overlay hidden">
            <div class="menu-panel">
                <button id="menu-close-btn">✕</button>
                <h2>#c0ffee</h2>
                <p>コーヒーを丁寧に淹れて<br>お客様を癒やそう</p>
                <div class="menu-stats">
                    <span id="menu-total-customers">通算 0 人のお客様</span>
                </div>
                <button id="menu-restart-btn" class="btn-primary">タイトルへ戻る</button>
            </div>
        </div>

    </main>

    <script type="module" src="js/app.js"></script>
</body>

</html>
